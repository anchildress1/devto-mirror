[project]
name = "devto-mirror"
version = "1.2.0"
description = "Static HTML mirror of Dev.to blog posts for better search engine discoverability"
authors = [
    {name = "Ashley Childress", email = "anchildress1@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
    "jinja2>=3.1.6",
    "python-slugify>=9.0.0",
    "bleach>=6.4.0",
    "python-dotenv>=1.2.3",
    "urllib3>=2.7.0",
    "idna>=3.19",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "click>=8.5.0",
    "flake8>=7.3.0",
    "gitlint-rai>=1.0.3",
    "detect-secrets>=1.5.0",
    "black>=26.5.1",
    "isort>=9.0.1",
    "coverage>=7.16.1",
    "radon>=6.0.1",
    "pygments>=2.21.0",
    "pip>=26.2.1",
]

[tool.uv]
# gitlint-core's trusted-deps extra hard-pins click==8.1.3 (PYSEC-2026-2132)
# and sh==1.14.3 (CVE-2026-54552). Override past both so gitlint-rai still
# resolves without carrying the vulnerable versions.
override-dependencies = [
    "click>=8.5.0",
    "sh>=2.2.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["specs*", "assets*", "tests*", ".github*"]

[tool.black]
line-length = 120
skip-string-normalization = false
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "tests/*",
    "*/test_*",
    "*/__pycache__/*",
    ".venv/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
