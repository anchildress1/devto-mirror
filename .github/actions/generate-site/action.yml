name: Generate Dev.to Mirror Site
description: >-
  Restore the article store from the state branch, generate the mirror site,
  and assemble the deployable `_deploy` directory. Shared by the Firebase and
  gh-pages deploy workflows so both produce identical output.

inputs:
  devto_username:
    description: Dev.to username to mirror
    required: true
  gh_username:
    description: GitHub username used to build the Pages URL when site_domain is unset
    required: false
    default: ""
  site_domain:
    description: Bare domain the site is served from (e.g. example.com); overrides the Pages URL
    required: false
    default: ""
  devto_key:
    description: Dev.to API key (optional; raises API rate limits)
    required: false
    default: ""
  force_full_regen:
    description: Refetch every article instead of only new or edited ones
    required: false
    default: "false"
  state_branch:
    description: Branch holding the article store (posts_data.json)
    required: false
    default: gh-pages
  firebase_web_config:
    description: Firebase web app config as JSON; enables Analytics injection when set
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore article store
      shell: bash
      env:
        STATE_BRANCH: ${{ inputs.state_branch }}
      run: |
        set -euo pipefail
        # Exit code 2 means the branch does not exist yet; anything else is a real failure.
        status=0
        git ls-remote --exit-code origin "refs/heads/$STATE_BRANCH" >/dev/null || status=$?
        if [ "$status" -eq 2 ]; then
          echo "🆕 ${STATE_BRANCH} does not exist yet; starting from an empty store" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        elif [ "$status" -ne 0 ]; then
          echo "::error::git ls-remote failed for ${STATE_BRANCH} (exit $status)"
          exit "$status"
        fi
        # actions/checkout narrows the fetch refspec to the checked-out ref, so a
        # bare branch name here would only populate FETCH_HEAD, not origin/$STATE_BRANCH.
        git fetch origin "$STATE_BRANCH":"refs/remotes/origin/$STATE_BRANCH" --depth=1
        if git cat-file -e "origin/${STATE_BRANCH}:posts_data.json" 2>/dev/null; then
          git show "origin/${STATE_BRANCH}:posts_data.json" > posts_data.json
          echo "🔄 Restored posts_data.json from ${STATE_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "⚠️ No posts_data.json on ${STATE_BRANCH}; every article will be fetched" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Set up uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        # Pinned: --no-build exempts the editable first-party project only on uv >= 0.12.
        version: "0.12.13"
        python-version: "3.12"
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --no-build --no-dev

    - name: Generate site
      shell: bash
      env:
        DEVTO_USERNAME: ${{ inputs.devto_username }}
        GH_USERNAME: ${{ inputs.gh_username }}
        SITE_DOMAIN: ${{ inputs.site_domain }}
        DEVTO_KEY: ${{ inputs.devto_key }}
        FORCE_FULL_REGEN: ${{ inputs.force_full_regen }}
        FIREBASE_WEB_CONFIG: ${{ inputs.firebase_web_config }}
      run: |
        echo "## 🏗️ Site Generation for \`${DEVTO_USERNAME}\`" >> "$GITHUB_STEP_SUMMARY"
        uv run --locked --no-build --no-dev python -m devto_mirror.site_generation.generator

    - name: Add static files to deployment
      shell: bash
      env:
        STATE_BRANCH: ${{ inputs.state_branch }}
      run: |
        mkdir -p _deploy/assets
        cp .nojekyll google6b80426bb396f31f.html algolia_verification.html _deploy/
        cp assets/devto-mirror.jpg _deploy/assets/
        # gh-pages doubles as the state branch for forks, so the store must ship with the site there.
        if [ "$STATE_BRANCH" = "gh-pages" ]; then
          cp posts_data.json _deploy/
        fi
        echo "✅ Generated $(find _deploy/posts -name '*.html' | wc -l | tr -d ' ') post pages" >> "$GITHUB_STEP_SUMMARY"
